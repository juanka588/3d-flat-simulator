name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1' # weekly: the licence job below
    - cron: '0 3 * * *' # nightly: the full browser suite (e2e)
  workflow_dispatch:
    inputs:
      demo_backend:
        description: 'mcp-nightly LLM demo backend. Only "api" (ANTHROPIC_API_KEY secret) is wired; a local claude CLI backend is planned (see the comment on the demo steps).'
        type: choice
        options: [api]
        default: api

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The Pages build: the bundle-size and material-library gates run on exactly what is deployed.
      - run: pnpm build
        env:
          BASE_PATH: /3d-flat-simulator/
      # JS/CSS gzip may grow at most the milestone budget over scripts/ci/bundle-baseline.json.
      - run: node scripts/ci/bundle-size.mjs
      # dist/materials <= 8 MiB, no file outside catalog.json, every sha256 matches.
      - run: node scripts/ci/check-materials.mjs
      # M5.15 model library: every file in dist/models is in the catalog with its sha256; <= 300 KB/model, <= 6 MiB total,
      # <= 20k triangles, <= 4 materials; credits present.
      - run: node scripts/ci/check-models.mjs
      # D4 local-only guard: no retailer host in the Pages build or in tracked files, no stray GLB/GLTF, no .env or 3D-FUTURE files.
      - run: node scripts/ci/check-no-retailer.mjs

  # The texture sources must still publish CC0 (the committed library is only CC0 while they do).
  licence:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 5 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/ci/licence-pages.mjs

  # The full browser suite is software-WebGL heavy (~35 CPU-minutes) and slow/flaky on hosted runners, so it
  # does not gate pushes: it runs nightly and on demand (Actions → CI → Run workflow), non-blocking.
  # Pushes get the fast gates: `check` + `e2e-static`. Run the full suite locally with `pnpm e2e`.
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm e2e --shard=${{ matrix.shard }}
        env:
          E2E_STATIC: skip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # M4 MCP tier: the render service (headless Chromium + the real apps/server) and the automated LLM demo.
  # Its own job, on purpose: it does not depend on `check` or on any `e2e` shard (`needs` is absent and the
  # steps use `!cancelled()`), so a flaky browser shard cannot hide it and it cannot hide them; it shows up
  # as its own check ("mcp-nightly"), non-blocking like `e2e`. Nightly and on demand only.
  mcp-nightly:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    env:
      # Secrets cannot be tested in a step `if` directly; this flag can.
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Build the web app the renderer serves
        run: BASE_PATH=/ pnpm --filter @flat/web build
      - name: MCP render tests
        id: render
        run: pnpm test:render
      # M4.14 automated LLM demo (positive and negative). Spends real tokens (capped at $2 by default), so it only
      # runs where the repository has the secret, and a failed render step does not skip it.
      # Backend: the Messages API with the ANTHROPIC_API_KEY secret. A local `claude` CLI backend (the maintainer's
      # own login, for runs on a self-hosted/dev machine) is to be added here as another step gated on
      # `inputs.demo_backend == 'claude-cli'`; until then `demo_backend` offers only `api`.
      - name: MCP LLM demo (positive)
        id: demo
        if: ${{ !cancelled() && env.HAS_ANTHROPIC_KEY == 'true' && (inputs.demo_backend == 'api' || inputs.demo_backend == '') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FLAT_DEMO_MODEL: claude-sonnet-5-5
        run: pnpm mcp:demo
      - name: 'MCP LLM demo (negative - "remove a wall" must be refused)'
        if: ${{ !cancelled() && steps.demo.conclusion != 'skipped' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FLAT_DEMO_MODEL: claude-sonnet-5-5
        run: pnpm mcp:demo -- --negative
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### mcp-nightly"
            echo "- render tier: ${{ steps.render.outcome }}"
            echo "- LLM demo: ${{ steps.demo.outcome }} (skipped without the ANTHROPIC_API_KEY secret)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mcp-nightly-artifacts
          path: |
            test-results/
            apps/mcp/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The production build under the GitHub Pages base path (vite preview): catalog and textures load,
  # autosave restores, the ?test hook is gated. Runs in parallel with `e2e` (chromium only, 4 tests).
  e2e-static:
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_STATIC: only
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-static
          path: |
            playwright-report/
            test-results/
          retention-days: 7
