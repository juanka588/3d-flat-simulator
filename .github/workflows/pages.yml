name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flat/web build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Local-only guards (D4) on exactly what is about to be deployed. This workflow does not wait for CI, so a
      # leak (retailer host, stray GLB, oversized or unlisted material / model) must fail HERE, before the upload.
      - name: Guard - no retailer data in the Pages build
        run: node scripts/ci/check-no-retailer.mjs --dist apps/web/dist
      - name: Guard - model library
        run: node scripts/ci/check-models.mjs
      - name: Guard - material library
        run: node scripts/ci/check-materials.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
